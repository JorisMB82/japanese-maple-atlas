name: Editorial correction
description: Report a factual, citation, terminology, rendering or metadata problem.
title: "[Correction]: "
labels: ["editorial", "correction"]
body:
  - type: input
    id: location
    attributes:
      label: Page or repository path
      placeholder: atlas-repository/cultivars/RC-001.json
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Quote or describe the affected content and why it is incorrect or misleading.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction and evidence
      description: Supply the corrected formulation and supporting authority.
    validations:
      required: true
