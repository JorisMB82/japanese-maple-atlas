name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run validate:contributions
      - run: npm run compile:atlas:check
      - run: npm run validate:repository
      - name: Validate semantic search
        run: |
          set -o pipefail
          npm run validate:search 2>&1 | tee search-validation.log
      - name: Build production application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log
      - name: Upload Sprint 8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-8-validation-diagnostics
          path: |
            search-validation.log
            production-build.log
