name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronise package lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Publish lockfile and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/repository-validation.yml <<'EOF'
          name: Repository validation

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]
            workflow_dispatch:

          jobs:
            validate-and-build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm install --no-audit --no-fund
                - run: npm run validate:contributions
                - run: npm run compile:atlas:check
                - run: npm run validate:repository
                - run: npm run validate:search
                - run: npm run build
          EOF
          sed -i 's/^          //' .github/workflows/repository-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/repository-validation.yml
          git commit -m "Synchronise Sprint 8 package lock and permanent CI"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - run: npm install --no-audit --no-fund
      - run: npm run validate:contributions
      - run: npm run compile:atlas:check
      - run: npm run validate:repository
      - run: npm run validate:search
      - run: npm run build
