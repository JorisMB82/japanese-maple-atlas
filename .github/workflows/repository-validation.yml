name: Sprint 11.5 materialise compact source

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/sprint-11-5-media-governance-clean]
    paths: [.github/workflows/repository-validation.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-5-media-governance-clean
          fetch-depth: 1
          show-progress: false

      - name: Verify compact implementation archive
        shell: bash
        run: |
          set -euo pipefail
          for part in .sprint-11-5-publish/patch-{00..05}; do
            test -s "$part"
          done
          cat .sprint-11-5-publish/patch-{00..05} > /tmp/sprint-11-5.b64
          base64 --decode /tmp/sprint-11-5.b64 > /tmp/sprint-11-5.tar.xz
          xz -t /tmp/sprint-11-5.tar.xz
          tar -tJf /tmp/sprint-11-5.tar.xz > /tmp/sprint-11-5.inventory
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/sprint-11-5.inventory; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          for required in package.json scripts/process-media.mjs scripts/validate-media.mjs schemas/media.schema.json atlas-repository/governance/media-policy.json SPRINT-11.5.md .github/workflows/repository-validation.yml; do
            grep -Fxq "$required" /tmp/sprint-11-5.inventory
          done

      - name: Apply clean Sprint 11.5 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/sprint-11-5.tar.xz
          rm -rf .sprint-11-5-publish
          test "$(node -p "require('./package.json').version")" = '0.11.5'
          test -f scripts/process-media.mjs
          test -f scripts/validate-media.mjs
          test -f atlas-repository/governance/media-policy.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate deterministic outputs
        run: |
          npm run process:media
          npm run compile:atlas

      - name: Run complete release verification
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:repository
          npm run test
          npm run test:coverage
          npm run validate:scale
          npm run build
          npm run test:regression
          npm run validate:quality

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atlas Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sprint 11.5: establish governed media pipeline'
          git push origin HEAD:agent/sprint-11-5-media-governance-clean
