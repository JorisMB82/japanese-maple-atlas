name: Sprint 11.5 trace source preparation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/sprint-11-5-media-governance-clean]
    paths: [.github/workflows/repository-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-5-media-governance-clean
          fetch-depth: 1
          show-progress: false
      - name: Trace preparation
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/prepare.log) 2>&1
          echo '1 segments'; ls -l .sprint-11-5-publish/patch-{00..05}; echo status=$?
          echo '2 concatenate'; cat .sprint-11-5-publish/patch-{00..05} > /tmp/sprint-11-5.b64; echo status=$?
          echo '3 decode'; base64 --decode /tmp/sprint-11-5.b64 > /tmp/sprint-11-5.tar.xz; echo status=$?
          echo '4 xz'; xz -t /tmp/sprint-11-5.tar.xz; echo status=$?
          echo '5 extract'; tar -xJf /tmp/sprint-11-5.tar.xz; echo status=$?
          echo '6 workflow present'; ls -l .github/workflows/repository-validation.yml; echo status=$?
          echo '7 restore workflow'; git checkout HEAD -- .github/workflows/repository-validation.yml; echo status=$?
          echo '8 remove payload'; rm -rf .sprint-11-5-publish; echo status=$?
          echo '9 decision record'; ls -l docs/DR-011-002_Governed-Media-Derivatives.md; echo status=$?
          echo '10 normalize'; sed -i 's/[[:space:]]\+$//' docs/DR-011-002_Governed-Media-Derivatives.md; echo status=$?
          echo '11 version'; node -p "require('./package.json').version"; echo status=$?
          echo '12 status'; git status --short; echo status=$?
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-11-5-prepare-trace
          path: /tmp/prepare.log
          if-no-files-found: error
          retention-days: 3
