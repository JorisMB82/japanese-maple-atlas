name: Sprint 11.5 diagnose compact archive

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/sprint-11-5-media-governance-clean]
    paths: [.github/workflows/repository-validation.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-5-media-governance-clean
          fetch-depth: 1
          show-progress: false

      - name: Diagnose compact implementation archive
        shell: bash
        run: |
          set +e
          echo '--- segment sizes ---'
          ls -l .sprint-11-5-publish/patch-{00..05}
          wc -c .sprint-11-5-publish/patch-{00..05}
          cat .sprint-11-5-publish/patch-{00..05} > /tmp/sprint-11-5.b64
          echo "combined_b64_bytes=$(wc -c < /tmp/sprint-11-5.b64)"
          base64 --decode /tmp/sprint-11-5.b64 > /tmp/sprint-11-5.tar.xz
          decode_status=$?
          echo "base64_status=$decode_status decoded_bytes=$(wc -c < /tmp/sprint-11-5.tar.xz)"
          xz -t /tmp/sprint-11-5.tar.xz
          xz_status=$?
          echo "xz_status=$xz_status"
          tar -tJf /tmp/sprint-11-5.tar.xz > /tmp/sprint-11-5.inventory
          tar_status=$?
          echo "tar_status=$tar_status inventory_lines=$(wc -l < /tmp/sprint-11-5.inventory)"
          echo '--- inventory ---'
          cat /tmp/sprint-11-5.inventory
          echo '--- required paths ---'
          for required in package.json scripts/process-media.mjs scripts/validate-media.mjs schemas/media.schema.json atlas-repository/governance/media-policy.json SPRINT-11.5.md .github/workflows/repository-validation.yml; do
            if grep -Fxq "$required" /tmp/sprint-11-5.inventory; then
              echo "present $required"
            else
              echo "MISSING $required"
            fi
          done
          test "$decode_status" -eq 0
          test "$xz_status" -eq 0
          test "$tar_status" -eq 0
