name: Repository quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-housekeeping:
    name: Delete explicit stale branch refs
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/repository-housekeeping-three-track-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete reviewed stale branches
        shell: bash
        run: |
          set -euo pipefail
          stale_branches=(
            'sprint-6-atlas-compiler'
            'sprint-7-editorial-pipeline'
            'sprint-8-advanced-search'
            'sprint-9-knowledge-graph'
            'sprint-9-5-testing-quality'
            'sprint-10-interactive-atlas-explorer'
            'sprint-10-usability-remediation'
            'agent/sprint-11-compiler-generalisation'
            'agent/sprint-11-compiler-generalisation-cleanup'
            'agent/sprint-11-compiler-generalisation-payload'
            'agent/sprint-11-compiler-generalisation-payload2'
            'agent/sprint-11-compiler-generalisation-temp'
            'agent/sprint-11-compiler-generalisation-testtree'
            'agent/sprint-11-compiler-generalisation-unused'
            'agent/sprint-11-5-media-governance'
            'agent/sprint-11-5-media-governance-clean'
            'agent/approve-roadmap-v1-1'
          )

          for branch in "${stale_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting stale branch: $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

  repository-and-tests:
    name: Repository, schemas and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run process:media
      - run: npm run validate:media
      - run: npm run process:media:check
      - run: npm run validate:contributions
      - run: npm run validate:reference-standards
      - run: npm run compile:atlas:check
      - run: npm run validate:scale
      - run: npm run validate:schemas
      - run: npm run validate:repository
      - run: npm run validate:search
      - run: npm run validate:graph
      - run: npm run validate:explorer
      - run: npm run test:unit
      - run: npm run test:integration

  coverage:
    name: Native Node coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-11-5-coverage
          path: quality-reports/coverage.txt
          if-no-files-found: error
          retention-days: 30

  production-build:
    name: Production build and static regression
    needs: [repository-and-tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run static export regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p quality-reports
          npm run test:regression 2>&1 | tee quality-reports/regression.txt
      - name: Regenerate deterministic scale evidence for aggregate validation
        run: npm run validate:scale
      - run: npm run validate:quality
      - run: npm run release:manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-11-5-quality-evidence
          path: |
            quality-reports/
            release-artifacts/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint-11-5-static-export
          path: out/
          if-no-files-found: error
          retention-days: 14
