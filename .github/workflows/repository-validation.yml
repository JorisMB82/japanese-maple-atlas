name: Repository validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Finalise compiler and validator
        run: node scripts/finalize-sprint7.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile generated repository outputs
        run: npm run compile:atlas
      - name: Validate contributor inputs
        run: npm run validate:contributions
      - name: Verify deterministic compiler output
        run: npm run compile:atlas:check
      - name: Validate repository integrity
        run: npm run validate:repository
      - name: Build production application
        run: npm run build
      - name: Publish verified generated outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/finalize-sprint7.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sprint 7: finalise generated outputs and production validation"
          git push origin HEAD:${{ github.head_ref }}
