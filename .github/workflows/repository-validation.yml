name: Sprint 11.5 inspect compact archive

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/sprint-11-5-media-governance-clean]
    paths: [.github/workflows/repository-validation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-5-media-governance-clean
          fetch-depth: 1
          show-progress: false
      - name: Build inventory
        shell: bash
        run: |
          set -euo pipefail
          cat .sprint-11-5-publish/patch-{00..05} > /tmp/sprint-11-5.b64
          base64 --decode /tmp/sprint-11-5.b64 > /tmp/sprint-11-5.tar.xz
          xz -t /tmp/sprint-11-5.tar.xz
          tar -tJf /tmp/sprint-11-5.tar.xz | sort > sprint-11-5-inventory.txt
          wc -l sprint-11-5-inventory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-11-5-compact-inventory
          path: sprint-11-5-inventory.txt
          if-no-files-found: error
          retention-days: 3
