name: Repository validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run validate:contributions
      - run: npm run compile:atlas:check
      - run: npm run validate:repository
      - name: Validate semantic search
        run: npm run validate:search 2>&1 | tee search-validation.log
      - name: Upload semantic search diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-8-search-validation
          path: search-validation.log
      - run: npm run build
