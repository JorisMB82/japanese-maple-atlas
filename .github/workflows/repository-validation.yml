name: Sprint 11.5 materialise verified source

on:
  push:
    branches: [agent/sprint-11-5-media-governance-clean]
    paths: [.github/workflows/repository-validation.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-5-media-governance-clean
          fetch-depth: 0

      - name: Verify implementation payload
        shell: bash
        run: |
          set -euo pipefail
          payload=.sprint-11-5-publish/payload.b64
          test -s "$payload"
          test "$(wc -c < "$payload")" -eq 132784
          echo 'f39733345dfa8582c2cbd09af8e8cd47366fa8f449d28dfd9750a3b2986974a6  .sprint-11-5-publish/payload.b64' | sha256sum --check
          base64 --decode "$payload" > /tmp/sprint-11-5.tar.gz
          echo '177ae3180b3c7b87ac2930fbc61ad3d9d24b4ba9a5af950d8ae15a6518a73096  /tmp/sprint-11-5.tar.gz' | sha256sum --check
          gzip -t /tmp/sprint-11-5.tar.gz
          tar -tzf /tmp/sprint-11-5.tar.gz > /tmp/sprint-11-5.inventory
          test "$(wc -l < /tmp/sprint-11-5.inventory)" -eq 73
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/sprint-11-5.inventory; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          grep -Fxq 'package.json' /tmp/sprint-11-5.inventory
          grep -Fxq 'scripts/validate-media.mjs' /tmp/sprint-11-5.inventory
          grep -Fxq 'schemas/media.schema.json' /tmp/sprint-11-5.inventory
          grep -Fxq 'SPRINT-11.5.md' /tmp/sprint-11-5.inventory
          grep -Fxq '.github/workflows/repository-validation.yml' /tmp/sprint-11-5.inventory

      - name: Apply clean Sprint 11.5 source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/sprint-11-5.tar.gz
          rm -rf .sprint-11-5-publish
          test "$(node -p "require('./package.json').version")" = '0.11.5'
          test -f scripts/validate-media.mjs
          test -f lib/media-pipeline.mjs
          test -f atlas-repository/governance/media-policy.json
          test ! -e .github/workflows/sprint-11-5-publish.yml

      - name: Revalidate materialised repository
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:repository
          npm run test
          npm run test:coverage
          npm run validate:scale

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Atlas Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Sprint 11.5: establish governed media pipeline'
          git push origin HEAD:agent/sprint-11-5-media-governance-clean
