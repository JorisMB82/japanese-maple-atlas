name: Sprint 7 materialize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sprint-7-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Materialize, validate and publish Sprint 7
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .sprint7/payload.b64 ]]; then
            echo "Sprint 7 payload already materialized."
            exit 0
          fi

          workdir="$(mktemp -d)"
          base64 --decode .sprint7/payload.b64 > "$workdir/payload.tar.xz"
          tar -xJf "$workdir/payload.tar.xz" -C "$workdir"
          rsync -a "$workdir/sprint7-overlay/" ./

          if [[ -f DELETE-THESE-FILES.txt ]]; then
            while IFS= read -r path; do
              [[ -n "$path" ]] && rm -rf -- "$path"
            done < DELETE-THESE-FILES.txt
            rm -f DELETE-THESE-FILES.txt
          fi
          rm -rf .sprint7

          npm install --no-audit --no-fund
          npm run validate:contributions
          npm run compile:atlas:check
          npm run validate:repository
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Sprint 7 changes to publish."
            exit 0
          fi
          git commit -m "Sprint 7: implement editorial workflow and contributor pipeline"
          git push origin "HEAD:${{ github.head_ref }}"
