name: Sprint 7 materialize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Materialize Sprint 7 overlay
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .sprint7/payload.b64 ]]; then
            echo "Sprint 7 payload already materialized."
            exit 0
          fi
          workdir="$(mktemp -d)"
          base64 -d .sprint7/payload.b64 > "$workdir/payload.tar.xz"
          tar -xJf "$workdir/payload.tar.xz" -C "$workdir"
          rsync -a "$workdir/sprint7-overlay/" ./
          if [[ -f DELETE-THESE-FILES.txt ]]; then
            while IFS= read -r file; do
              [[ -n "$file" ]] && rm -rf -- "$file"
            done < DELETE-THESE-FILES.txt
            rm -f DELETE-THESE-FILES.txt
          fi
          rm -rf .sprint7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate contributor inputs
        run: npm run validate:contributions
      - name: Verify deterministic compiler output
        run: npm run compile:atlas:check
      - name: Validate repository integrity
        run: npm run validate:repository
      - name: Build production application
        run: npm run build
      - name: Publish materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Sprint 7 changes to publish."
            exit 0
          fi
          git commit -m "Sprint 7: implement editorial workflow and contributor pipeline"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
