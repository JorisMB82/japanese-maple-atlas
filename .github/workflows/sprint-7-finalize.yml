name: Sprint 7 finalise

on:
  push:
    branches:
      - sprint-7-editorial-pipeline

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-7-editorial-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replace generated registry with deterministic directory loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path('scripts/compile-atlas.mjs')
          source = compiler.read_text()
          old = """  function registrySection(name, folder, items) {
            const imports = items.map((item, index) => `import ${name}${index} from '@/atlas-repository/${folder}/${item.id}.json';`).join('\\n');
            const values = items.map((_, index) => `${name}${index}`).join(',');
            return `${imports}\\nexport const ${name} = [${values}];`;
          }
          const registry = [
            \"// GENERATED FILE — DO NOT EDIT. Run `npm run compile:atlas`.\",
            \"import manifest from '@/atlas-repository/manifest.json';\",
            registrySection('cultivars', 'cultivars', cultivarObjects),
            registrySection('assertions', 'assertions', assertionObjects),
            registrySection('evidence', 'evidence', evidenceObjects),
            registrySection('sources', 'sources', sources),
            registrySection('taxa', 'taxonomy', taxa),
            registrySection('relationships', 'relationships', relationships),
            registrySection('media', 'media', media),
            registrySection('contributors', 'contributors', contributorObjects),
            registrySection('submissions', 'submissions', submissionObjects),
            registrySection('editorialWorkflows', 'editorial-workflows', workflowObjects),
            registrySection('editorialReviews', 'editorial-reviews', reviewObjects),
            'export { manifest };', ''
          ].join('\\n\\n');
          outputs.set('lib/repository-registry.js', registry);
          """
          new = """  const registry = `// GENERATED FILE — DO NOT EDIT. Run \\`npm run compile:atlas\\`.\n\nimport fs from 'node:fs';\nimport path from 'node:path';\n\nconst repositoryRoot = path.join(process.cwd(), 'atlas-repository');\nconst loadJson = file => JSON.parse(fs.readFileSync(file, 'utf8'));\nconst loadDirectory = directory => {\n  const fullPath = path.join(repositoryRoot, directory);\n  return fs.readdirSync(fullPath)\n    .filter(file => file.endsWith('.json'))\n    .sort()\n    .map(file => loadJson(path.join(fullPath, file)));\n};\n\nexport const manifest = loadJson(path.join(repositoryRoot, 'manifest.json'));\nexport const cultivars = loadDirectory('cultivars');\nexport const assertions = loadDirectory('assertions');\nexport const evidence = loadDirectory('evidence');\nexport const sources = loadDirectory('sources');\nexport const taxa = loadDirectory('taxonomy');\nexport const relationships = loadDirectory('relationships');\nexport const media = loadDirectory('media');\nexport const contributors = loadDirectory('contributors');\nexport const submissions = loadDirectory('submissions');\nexport const editorialWorkflows = loadDirectory('editorial-workflows');\nexport const editorialReviews = loadDirectory('editorial-reviews');\n`;
          outputs.set('lib/repository-registry.js', registry);
          """
          if old not in source:
              raise SystemExit('Compiler registry block not found')
          compiler.write_text(source.replace(old, new))

          validator = Path('scripts/validate-repository.mjs')
          source = validator.read_text()
          old = """const registry = fs.readFileSync(path.join(ROOT, 'lib', 'repository-registry.js'), 'utf8');
          for (const { object } of Object.values(db).flat()) if (!registry.includes(`${object.id}.json`)) errors.push(`Registry missing import for ${object.id}`);
          if (!errors.some(error => error.startsWith('Registry missing'))) pass('generated JavaScript registry');
          """
          new = """const registry = fs.readFileSync(path.join(ROOT, 'lib', 'repository-registry.js'), 'utf8');
          const registryCategories = ['cultivars','assertions','evidence','sources','taxonomy','relationships','media','contributors','submissions','editorial-workflows','editorial-reviews'];
          for (const category of registryCategories) if (!registry.includes(`loadDirectory('${category}')`)) errors.push(`Registry missing category ${category}`);
          if (!registry.includes(\"loadJson(path.join(repositoryRoot, 'manifest.json'))\")) errors.push('Registry missing manifest loader');
          if (!errors.some(error => error.startsWith('Registry missing'))) pass('generated JavaScript registry');
          """
          if old not in source:
              raise SystemExit('Validator registry block not found')
          validator.write_text(source.replace(old, new))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile generated repository outputs
        run: npm run compile:atlas
      - name: Validate contributor inputs
        run: npm run validate:contributions
      - name: Verify deterministic compiler output
        run: npm run compile:atlas:check
      - name: Validate repository integrity
        run: npm run validate:repository
      - name: Build production application
        run: npm run build
      - name: Publish clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sprint-7-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sprint 7: finalise generated outputs and production validation"
          git push origin HEAD:sprint-7-editorial-pipeline
