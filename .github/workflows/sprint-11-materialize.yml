name: Sprint 11 materialize

on:
  push:
    branches:
      - agent/sprint-11-compiler-generalisation
    paths:
      - '.sprint11-tar/**'
      - '.github/workflows/sprint-11-materialize.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint-11-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-compiler-generalisation
          fetch-depth: 0
      - name: Reconstruct and verify exact Sprint 11 files
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            part-00a part-00b part-00c
            part-01 part-02 part-03 part-04 part-05
            part-06a part-06b part-06c
            part-07a part-07b part-07c
            part-08
          )
          for part in "${parts[@]}"; do
            test -f ".sprint11-tar/${part}"
          done
          : > /tmp/sprint11-files.tar.gz.b64
          for part in "${parts[@]}"; do
            cat ".sprint11-tar/${part}" >> /tmp/sprint11-files.tar.gz.b64
          done
          echo "f44fa865864509cad5a5c024212b09e9b04f4cf47950ad75cc5670885b752bc3  /tmp/sprint11-files.tar.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/sprint11-files.tar.gz.b64 > /tmp/sprint11-files.tar.gz
          echo "83e4c55e312b87bb293516e3af19f7fe012c5804a57dd692bb102e5bd998125e  /tmp/sprint11-files.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/sprint11-files.tar.gz
          tar --list --gzip --file /tmp/sprint11-files.tar.gz > /tmp/sprint11-files.list
          test "$(wc -l < /tmp/sprint11-files.list)" -gt 0
      - name: Overlay verified Sprint 11 source files
        shell: bash
        run: |
          set -euo pipefail
          tar --extract --gzip --file /tmp/sprint11-files.tar.gz --directory . \
            --exclude='.github/workflows/repository-validation.yml'
          git add --all
          git rm -r --ignore-unmatch .sprint11-bootstrap .sprint11-correct .sprint11-tar
      - name: Commit exact Sprint 11 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sprint 11: generalise compiler and lock RC-020 roadmap"
      - name: Push materialized branch
        shell: bash
        run: git push origin HEAD:agent/sprint-11-compiler-generalisation
