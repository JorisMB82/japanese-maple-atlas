name: Sprint 11 materialize

on:
  push:
    branches:
      - agent/sprint-11-compiler-generalisation
    paths:
      - '.sprint11-bootstrap/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint-11-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-compiler-generalisation
          fetch-depth: 0
      - name: Check payload completeness
        shell: bash
        run: |
          set -euo pipefail
          test -f .sprint11-bootstrap/part-00
          test -f .sprint11-bootstrap/part-01
          wc -c .sprint11-bootstrap/part-*
      - name: Decode payload
        shell: bash
        run: |
          set -euo pipefail
          cat .sprint11-bootstrap/part-* | base64 --decode > /tmp/sprint11.patch.gz
          file /tmp/sprint11.patch.gz
          sha256sum /tmp/sprint11.patch.gz
      - name: Decompress payload
        shell: bash
        run: |
          set -euo pipefail
          gzip --test /tmp/sprint11.patch.gz
          gzip --decompress --stdout /tmp/sprint11.patch.gz > /tmp/sprint11.patch
          wc -c /tmp/sprint11.patch
          sha256sum /tmp/sprint11.patch
      - name: Validate patch application
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/sprint11.patch
      - name: Materialize verified tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/sprint11.patch
          git rm -r .sprint11-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sprint 11: generalise compiler and lock RC-020 roadmap"
          git push origin HEAD:agent/sprint-11-compiler-generalisation
