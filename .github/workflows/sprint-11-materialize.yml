name: Sprint 11 materialize

on:
  push:
    branches:
      - agent/sprint-11-compiler-generalisation
    paths:
      - '.sprint11-correct/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint-11-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-compiler-generalisation
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04; do
            test -f ".sprint11-correct/part-${part}"
          done
          cat .sprint11-correct/part-* > /tmp/sprint11.patch.gz.b64
          echo "ac624509208a1b60e68b1ee3494b7bebfadc038e80ae3465d59ea26cab447602  /tmp/sprint11.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/sprint11.patch.gz.b64 > /tmp/sprint11.patch.gz
          echo "04fb45987261826f7fa5604944454d5a54e3de7f429b0b800433d53dba9eb652  /tmp/sprint11.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/sprint11.patch.gz
          gzip --decompress --stdout /tmp/sprint11.patch.gz > /tmp/sprint11.patch
          echo "61030548f0de289bc148c2e8c52415d8040e98830ea04ea6ce6c6e10efdbcf03  /tmp/sprint11.patch" | sha256sum --check --strict
      - name: Apply and publish verified Sprint 11 tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/sprint11.patch
          git apply --index /tmp/sprint11.patch
          git rm -r .sprint11-bootstrap .sprint11-correct .github/workflows/sprint-11-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sprint 11: generalise compiler and lock RC-020 roadmap"
          git push origin HEAD:agent/sprint-11-compiler-generalisation
