name: Prepare raster dependency lock

on:
  push:
    branches: [engineering/sprint-12-wave-1]
    paths:
      - package.json
      - .github/workflows/prepare-raster-lock.yml

permissions:
  contents: write

jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/sprint-12-wave-1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock raster media dependencies"
          git push origin HEAD:engineering/sprint-12-wave-1
