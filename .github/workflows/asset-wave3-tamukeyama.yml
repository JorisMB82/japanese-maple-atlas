name: Temporary Wave 3 Tamukeyama asset acquisition

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  acquire-tamukeyama:
    if: github.head_ref == 'media/visual-first-assets-wave-3-tamukeyama'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-wave-3-tamukeyama
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Acquire exact Tamukeyama originals and build governed package
        run: |
          cat > .tmp-wave3-tamukeyama.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { decodeRaster, renderRasterProfiles } from './lib/raster-media.mjs';
          import { PROFILES } from './scripts/process-media.mjs';

          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const cleanHtml = value => String(value || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#039;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
          const reviewedAt = '2026-07-30T17:00:00Z';
          const reviewedDate = '2026-07-30';
          const branch = 'media/visual-first-assets-wave-3-tamukeyama';
          const ncStatePage = 'https://plants.ces.ncsu.edu/plants/acer-palmatum-subsp-matsumurae/common-name/laceleaf-japanese-maple/';

          async function fetchWithRetry(url, label) {
            let response;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              if (attempt > 0) await sleep(5000 * (2 ** (attempt - 1)));
              response = await fetch(url, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 visual-first-media' } });
              if (response.status !== 429 && response.status < 500) return response;
              console.log(label + ': HTTP ' + response.status + '; retry ' + (attempt + 1) + '/6');
            }
            return response;
          }

          const commonsCandidates = [
            {
              id:'MED-CUL-000021-001', title:"Acer palmatum 'Tamukeyama' at Coker Arboretum.jpg", role:'habit-primary', isPrimary:true,
              creator:'Mx. Granger', rightsHolder:'Mx. Granger', expectedLicence:/CC0/i,
              altText:'Source-identified ‘Tamukeyama’ Japanese maple showing its cascading whole-plant form at Coker Arboretum.',
              caption:'Whole-plant habit of a source-identified ‘Tamukeyama’ Japanese maple at Coker Arboretum.',
              basis:'The Commons source identifies this named plant at Coker Arboretum.',
              limitations:'No accession or propagation record was recovered. Similar red dissectum cultivars cannot be authenticated by habit or colour alone.',
              qualification:'Source-identified at Coker Arboretum; not independently authenticated by the Japanese Maple Atlas. Similar red dissectum cultivars remain visually confusable.',
              location:'Coker Arboretum, Chapel Hill, North Carolina, United States'
            },
            {
              id:'MED-CUL-000021-002', title:'Acer palmatum var. dissectum Tamukeyama 0zz.jpg', role:'foliage-detail', isPrimary:false,
              creator:'David J. Stang', rightsHolder:'David J. Stang', expectedLicence:/CC BY-SA 4\.0/i,
              altText:'Deeply dissected foliage on a source-identified ‘Tamukeyama’ Japanese maple photographed at Behnke Nurseries.',
              caption:'Attached foliage detail from a plant identified as ‘Tamukeyama’ at Behnke Nurseries.',
              basis:'David J. Stang identifies the photographed nursery plant as Acer palmatum var. dissectum ‘Tamukeyama’.',
              limitations:'The nursery identification is source assertion, and the historical taxon wording is not an Atlas taxonomic decision. Leaf colour alone is not diagnostic.',
              qualification:'Source-identified at Behnke Nurseries; not independently authenticated by the Japanese Maple Atlas. Similar red dissectum foliage must not be treated as cultivar proof.',
              location:'Former Behnke Nurseries, Potomac, Maryland, United States'
            }
          ];

          const licenceUrl = licence => {
            if (/CC0/i.test(licence)) return 'https://creativecommons.org/publicdomain/zero/1.0/';
            if (/CC BY-SA 4\.0/i.test(licence)) return 'https://creativecommons.org/licenses/by-sa/4.0/';
            if (/CC BY 4\.0/i.test(licence)) return 'https://creativecommons.org/licenses/by/4.0/';
            throw new Error('Unsupported selected licence: ' + licence);
          };

          const sourceDirectory = 'atlas-repository/media-sources/catalogue/CUL-000021';
          fs.mkdirSync(sourceDirectory, { recursive:true });
          fs.mkdirSync('public/media/derivatives/catalogue/cul-000021', { recursive:true });
          const assets = [];
          const items = [];

          async function addAsset(candidate, sourceBytes, sourcePage, originalUrl, selectedLicence, metadata = {}) {
            const sourcePath = sourceDirectory + '/' + candidate.id + '-source.jpg';
            fs.writeFileSync(sourcePath, sourceBytes);
            const decoded = decodeRaster(sourceBytes);
            const rendered = renderRasterProfiles(sourceBytes, PROFILES);
            const derivatives = Object.entries(rendered).map(([profile, output]) => {
              const derivativePath = '/media/derivatives/catalogue/cul-000021/' + candidate.id.toLowerCase() + '-' + profile + '.jpg';
              fs.writeFileSync(path.join('public', derivativePath.replace(/^\//, '')), output.bytes);
              return { profile, path:derivativePath, width:output.width, height:output.height, mimeType:output.mimeType, sha256:sha256(output.bytes), derivedFrom:candidate.id };
            });
            const attribution = candidate.creator + ' — ' + selectedLicence + '.';
            assets.push({
              id:candidate.id, cultivarId:'CUL-000021', mediaType:'photograph', role:candidate.role, isPrimary:candidate.isPrimary, status:'approved',
              assetPath:derivatives.find(item => item.profile === 'display').path,
              thumbnailPath:derivatives.find(item => item.profile === 'thumb').path,
              altText:candidate.altText, caption:candidate.caption, creator:candidate.creator, rightsHolder:candidate.rightsHolder,
              rightsBasis:selectedLicence.startsWith('CC0') ? 'public-domain' : 'creative-commons', licence:selectedLicence,
              licenceUrl:licenceUrl(selectedLicence), sourceUrl:sourcePage, sourceItemId:metadata.sourceItemId || null,
              attributionText:attribution,
              source:{ path:'/' + sourcePath, sha256:sha256(sourceBytes), preservation:'Exact original JPEG bytes downloaded from the governed source and retained without modification.' },
              identity:{ confidence:'source-asserted', identificationBasis:candidate.basis, limitations:candidate.limitations, publicQualification:candidate.qualification },
              privacy:{ status:'location-generalised', exifRetained:false, gpsRetained:false, locationGranularity:candidate.location },
              derivatives,
              approvalHistory:[{ status:'approved', date:reviewedDate, authority:'Japanese Maple Atlas media / visual-assets stream', note:'Exact source rights, attribution, red-dissectum identity qualification, role, privacy treatment and deterministic derivatives reviewed under the Visual-First Catalogue contract.' }]
            });
            items.push({
              mediaId:candidate.id, cultivarId:'CUL-000021', fileTitle:metadata.fileTitle || candidate.altText, sourcePage,
              exactOriginalUrl:originalUrl, sourceApiUrl:metadata.apiUrl || null, creator:candidate.creator, rightsHolder:candidate.rightsHolder,
              licence:selectedLicence, licenceUrl:licenceUrl(selectedLicence), sourceSha256:sha256(sourceBytes),
              originalWidth:metadata.width || decoded.width, originalHeight:metadata.height || decoded.height, originalBytes:sourceBytes.length,
              description:metadata.description || candidate.caption, dateTimeOriginal:metadata.dateTimeOriginal || null,
              role:candidate.role, primary:candidate.isPrimary, identityConfidence:'source-asserted', identityQualification:candidate.qualification,
              privacyTreatment:'Original preserved; public derivatives are pixel-decoded and re-encoded without EXIF, GPS or text metadata.', derivatives
            });
          }

          for (const candidate of commonsCandidates) {
            const params = new URLSearchParams({ action:'query', format:'json', formatversion:'2', prop:'imageinfo', titles:'File:' + candidate.title, iiprop:'url|size|mime|sha1|extmetadata' });
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + params;
            const metaResponse = await fetchWithRetry(apiUrl, candidate.title + ' metadata');
            if (!metaResponse?.ok) throw new Error(candidate.title + ': metadata HTTP ' + metaResponse?.status);
            const metadata = await metaResponse.json();
            const page = metadata.query?.pages?.[0];
            const info = page?.imageinfo?.[0];
            if (page?.missing || !info?.url) throw new Error(candidate.title + ': exact original not found');
            if (info.mime !== 'image/jpeg') throw new Error(candidate.title + ': expected JPEG, got ' + info.mime);
            const observedLicence = cleanHtml(info.extmetadata?.LicenseShortName?.value);
            if (!candidate.expectedLicence.test(observedLicence)) throw new Error(candidate.title + ': incompatible observed licence ' + observedLicence);
            const selectedLicence = /CC0/i.test(observedLicence) ? 'CC0 1.0' : 'CC BY-SA 4.0';
            const response = await fetchWithRetry(info.url, candidate.title + ' original');
            if (!response?.ok) throw new Error(candidate.title + ': original HTTP ' + response?.status);
            const bytes = Buffer.from(await response.arrayBuffer());
            if (!bytes.subarray(0,2).equals(Buffer.from([0xff,0xd8]))) throw new Error(candidate.title + ': bytes are not JPEG');
            const sourcePage = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(candidate.title).replace(/%2F/g, '/');
            await addAsset(candidate, bytes, sourcePage, info.url, selectedLicence, {
              fileTitle:candidate.title, sourceItemId:'Wikimedia Commons ' + candidate.title, apiUrl,
              width:info.width, height:info.height, description:cleanHtml(info.extmetadata?.ImageDescription?.value),
              dateTimeOriginal:cleanHtml(info.extmetadata?.DateTimeOriginal?.value)
            });
            await sleep(2500);
          }

          const ncResponse = await fetchWithRetry(ncStatePage, 'NC State source page');
          if (!ncResponse?.ok) throw new Error('NC State page HTTP ' + ncResponse?.status);
          const html = await ncResponse.text();
          for (const required of ["'Tamukeyama' form", 'Buncombe Co.', 'early fall', 'Randy Harter', 'CC BY 4.0']) {
            if (!html.includes(required)) throw new Error('NC State source page missing required evidence: ' + required);
          }
          const marker = 'Acer_palmatum_dissec_lbDQs5OzMAVf.jpeg';
          const markerIndex = html.indexOf(marker);
          if (markerIndex < 0) throw new Error('NC State exact early-fall source marker missing');
          const urlStart = html.lastIndexOf('https://eit-planttoolbox-prod.s3.amazonaws.com/', markerIndex);
          let urlEnd = html.indexOf('"', markerIndex);
          if (urlStart < 0 || urlEnd < 0) throw new Error('NC State signed source URL not recoverable');
          const originalUrl = html.slice(urlStart, urlEnd).replace(/&amp;/g, '&');
          const originalResponse = await fetchWithRetry(originalUrl, 'NC State early-fall original');
          if (!originalResponse?.ok) throw new Error('NC State original HTTP ' + originalResponse?.status);
          const originalBytes = Buffer.from(await originalResponse.arrayBuffer());
          if (!originalBytes.subarray(0,2).equals(Buffer.from([0xff,0xd8]))) throw new Error('NC State early-fall bytes are not JPEG');
          await addAsset({
            id:'MED-CUL-000021-003', role:'seasonal-diagnostic', isPrimary:false, creator:'Randy Harter', rightsHolder:'Randy Harter',
            altText:'Source-identified ‘Tamukeyama’ Japanese maple showing early-fall foliage and narrow dissected leaf context in Buncombe County, North Carolina.',
            caption:'Early-fall foliage of a source-identified ‘Tamukeyama’ Japanese maple in Buncombe County, North Carolina.',
            basis:'The NC State Extension Gardener Plant Toolbox identifies this frame as a ‘Tamukeyama’ form in Buncombe County, North Carolina, in early fall.',
            limitations:'The source uses form language and does not provide accession or propagation documentation. Similar red dissectum cultivars cannot be separated by colour alone.',
            qualification:'Source-identified by the NC State Extension Gardener Plant Toolbox; not independently authenticated by the Japanese Maple Atlas. Early-fall colour and narrow dissected foliage do not alone prove cultivar identity.',
            location:'Buncombe County, North Carolina, United States'
          }, originalBytes, ncStatePage, originalUrl, 'CC BY 4.0', {
            fileTitle:"'Tamukeyama' form, Buncombe Co. NC, early fall",
            sourceItemId:'NC State Plant Toolbox early-fall Tamukeyama image',
            description:"'Tamukeyama' form, Buncombe Co. NC, early fall",
            dateTimeOriginal:null
          });

          const sidecar = {
            schemaVersion:'1.0.0', cultivarId:'CUL-000021', publicationClass:'catalogue-profile', status:'approved', assets,
            roleException:null,
            review:{ reviewedBy:'Japanese Maple Atlas media / visual-assets stream', reviewedAt, notes:'Complete three-role Visual-First gallery using Coker Arboretum habit, David Stang nursery foliage and NC State early-fall context. Every item retains explicit red-dissectum confusion controls.' }
          };
          fs.writeFileSync('atlas-repository/catalogue-profiles/media/CUL-000021.media.json', JSON.stringify(sidecar, null, 2) + '\n');

          const profilePath = 'atlas-repository/catalogue-profiles/CUL-000021.json';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          profile.profileVersion = '1.1.0';
          profile.media = { state:'approved-primary', primaryMediaId:'MED-CUL-000021-001', candidateMediaIds:['MED-CUL-000021-002','MED-CUL-000021-003'], governedGap:null, visualComplete:true, identityBasis:'asserted' };
          profile.review.notes += ' A lawful three-role Visual-First gallery has completed media review; the profile remains non-public and publication is not claimed.';
          profile.revisionHistory.push({ version:'1.1.0', date:reviewedAt, actor:'Japanese Maple Atlas media / visual-assets stream', change:'Added an approved lawful three-role Catalogue gallery with exact source preservation, Creative Commons and public-domain rights records, red-dissectum identity qualifications, privacy-treated deterministic derivatives and canonical primary linkage; publication state remains unchanged.' });
          fs.writeFileSync(profilePath, JSON.stringify(profile, null, 2) + '\n');

          fs.writeFileSync('docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-TAMUKEYAMA-01.json', JSON.stringify({
            schemaVersion:'1.0.0', repositoryBaseline:'82900b9e071d733cbdccd34771454f6154a83fc8', branch, reviewedAt,
            packageId:'WAVE-3-TAMUKEYAMA-01', status:'complete-three-role-gallery', items
          }, null, 2) + '\n');

          fs.appendFileSync('docs/registers/MEDIA-CANDIDATE-REGISTER_C-003.md', [
            '', '## Wave 3 execution update — CUL-000021 Tamukeyama', '',
            'Three exact lawful originals completed the governed minimum gallery on 2026-07-30:', '',
            '- MED-CUL-000021-001 — habit-primary — Coker Arboretum — Mx. Granger — CC0 1.0.',
            '- MED-CUL-000021-002 — foliage-detail — Behnke Nurseries — David J. Stang — CC BY-SA 4.0.',
            '- MED-CUL-000021-003 — seasonal-diagnostic — Buncombe County early fall — Randy Harter — CC BY 4.0 via NC State Extension Gardener Plant Toolbox.', '',
            'All three items remain source-asserted. The gallery does not claim that red colour, dissected foliage or cascading form alone distinguishes Tamukeyama from Crimson Queen, Inaba-shidare, Red Dragon or Orangeola.', ''
          ].join('\n'));

          fs.appendFileSync('docs/MEDIA-017_Visual-First-Permission-and-Source-Acquisition-Queue.md', [
            '', '## Wave 3 Tamukeyama update — 2026-07-30', '',
            '- CUL-000021 Tamukeyama: complete three-role open-rights gallery acquired, hashed, processed and linked internally.',
            '- JCRA remains an optional accession-mapped strengthening route. No request sent and no permission claimed.', ''
          ].join('\n'));

          const qualityPath = 'quality/quality-gates.json';
          const quality = JSON.parse(fs.readFileSync(qualityPath, 'utf8'));
          quality.repositoryInvariants.catalogueMediaSidecars = 5;
          quality.repositoryInvariants.catalogueMediaAssets = 15;
          fs.writeFileSync(qualityPath, JSON.stringify(quality, null, 2) + '\n');

          const mediaTestPath = 'tests/integration/media-pipeline.test.mjs';
          let mediaTest = fs.readFileSync(mediaTestPath, 'utf8');
          mediaTest = mediaTest.replace('manifest.derivativeCount,68', 'manifest.derivativeCount,80');
          mediaTest = mediaTest.replace(').size,68', ').size,80');
          mediaTest = mediaTest.replace("image/jpeg').length,48", "image/jpeg').length,60");
          mediaTest = mediaTest.replace('5 Reference Standard assets; 12 Catalogue assets; 68 derivatives;', '5 Reference Standard assets; 15 Catalogue assets; 80 derivatives;');
          fs.writeFileSync(mediaTestPath, mediaTest);

          const catalogueTestPath = 'tests/integration/catalogue-profile-pipeline.test.mjs';
          let catalogueTest = fs.readFileSync(catalogueTestPath, 'utf8');
          catalogueTest = catalogueTest.replace("assert.equal(c003.every(record => record.mediaState === 'candidate-under-review'), true);", "assert.deepEqual(c003.map(record => [record.cultivarId, record.mediaState]), [\n    ['CUL-000021', 'approved-primary'],\n    ['CUL-000022', 'candidate-under-review'],\n    ['CUL-000023', 'candidate-under-review'],\n    ['CUL-000024', 'candidate-under-review'],\n    ['CUL-000025', 'candidate-under-review']\n  ]);");
          fs.writeFileSync(catalogueTestPath, catalogueTest);

          const rows = items.map(item => '| ' + item.mediaId + ' | ' + item.role + ' | ' + item.creator + ' | ' + item.licence + ' | ' + item.sourceSha256 + ' |');
          const handoff = [
            '# HANDOFF-MEDIA-CATALOGUE-008 — Wave 3 Tamukeyama Gallery', '',
            '**Status:** COMPLETE ASSET PACKAGE — protected review required',
            '**Protected baseline:** 82900b9e071d733cbdccd34771454f6154a83fc8',
            '**Execution branch:** ' + branch,
            '**Execution date:** 2026-07-30', '',
            '## Completed gallery', '',
            'CUL-000021 — Acer palmatum ‘Tamukeyama’ has one lawful habit-primary, one foliage-detail and one early-fall seasonal diagnostic. The profile remains non-public and publishedAt remains null.', '',
            '## Source inventory', '',
            '| Media ID | Role | Creator | Licence | Source SHA-256 |',
            '| --- | --- | --- | --- | --- |', ...rows, '',
            'Every exact source JPEG is preserved in the canonical source directory. Four deterministic JPEG derivatives per asset carry declared hashes, dimensions and lineage; public derivatives retain no EXIF, GPS or textual metadata.', '',
            '## Identity controls', '',
            '- All three items are source-asserted, not independently clone-authenticated.',
            '- Red colour and laceleaf form are not treated as sufficient to distinguish Tamukeyama from Crimson Queen, Inaba-shidare, Red Dragon or Orangeola.',
            '- No role exception, publication action, new identity or Reference Standard G5 change is included.', ''
          ].join('\n');
          fs.writeFileSync('docs/HANDOFF-MEDIA-CATALOGUE-008_Wave-3-Tamukeyama-Gallery.md', handoff);

          console.log(JSON.stringify({ assets:assets.length, derivatives:assets.flatMap(item => item.derivatives).length, sourceHashes:items.map(item => [item.mediaId,item.sourceSha256]) }, null, 2));
          NODE
          node .tmp-wave3-tamukeyama.mjs
          rm .tmp-wave3-tamukeyama.mjs

      - name: Generate canonical media manifest
        run: npm run process:media

      - name: Validate complete repository package
        run: |
          set -o pipefail
          {
            npm run validate:media
            npm run process:media:check
            npm run validate:contributions
            npm run validate:reference-standards
            npm run validate:catalogue
            npm run compile:atlas:check
            npm run compile:catalogue:check
            npm run validate:schemas
            npm run validate:repository
            npm run validate:search
            npm run validate:graph
            npm run validate:explorer
            npm run test:unit
            npm run test:integration
            npm run test:coverage
            npm run build
            npm run test:regression
            npm run validate:quality
            npm run release:manifest
          } 2>&1 | tee validation-wave3-tamukeyama.log

      - name: Upload inspection and validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave3-tamukeyama-gallery
          if-no-files-found: error
          retention-days: 14
          path: |
            atlas-repository/media-sources/catalogue/CUL-000021/
            public/media/derivatives/catalogue/cul-000021/
            atlas-repository/catalogue-profiles/media/CUL-000021.media.json
            atlas-repository/catalogue-profiles/CUL-000021.json
            docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-TAMUKEYAMA-01.json
            docs/HANDOFF-MEDIA-CATALOGUE-008_Wave-3-Tamukeyama-Gallery.md
            validation-wave3-tamukeyama.log

      - name: Commit governed Tamukeyama package and remove temporary workflow
        run: |
          rm .github/workflows/asset-wave3-tamukeyama.yml
          git config user.name "Japanese Maple Atlas Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Media: add lawful Tamukeyama gallery"
          git push origin HEAD:media/visual-first-assets-wave-3-tamukeyama
