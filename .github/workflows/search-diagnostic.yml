name: Sprint 8 search diagnostic

on:
  push:
    branches: [sprint-8-advanced-search]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-8-advanced-search
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture search validation
        shell: bash
        run: |
          node scripts/validate-search.mjs > .search-validation.log 2>&1 || true
          cat .search-validation.log
      - name: Publish diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .search-validation.log
          git commit -m "Capture Sprint 8 search validation diagnostic"
          git push origin HEAD:sprint-8-advanced-search
