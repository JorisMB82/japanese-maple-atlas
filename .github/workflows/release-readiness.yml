name: Release readiness

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run release:manifest
      - name: Package static export and release evidence
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tar -czf "release-artifacts/japanese-maple-atlas-${version}.tgz" out release-artifacts/release-manifest.json release-artifacts/checksums.sha256 release-artifacts/release-summary.md
          sha256sum "release-artifacts/japanese-maple-atlas-${version}.tgz" >> release-artifacts/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: japanese-maple-atlas-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/japanese-maple-atlas-*.tgz \
            release-artifacts/release-manifest.json \
            release-artifacts/checksums.sha256 \
            release-artifacts/release-summary.md \
            --verify-tag \
            --generate-notes \
            --title "Japanese Maple Atlas ${GITHUB_REF_NAME}"
