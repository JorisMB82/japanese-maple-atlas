name: Sprint 10 lock synchronisation

on:
  push:
    branches:
      - sprint-10-interactive-atlas-explorer
    paths:
      - .github/workflows/sprint-10-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-10-interactive-atlas-explorer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Publish synchronised lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronise package lock for Sprint 10"
          git push origin HEAD:sprint-10-interactive-atlas-explorer
