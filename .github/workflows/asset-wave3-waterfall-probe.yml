name: Temporary Waterfall alternate-source probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'media/visual-first-assets-wave-3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-wave-3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact NC State Waterfall image
        run: |
          cat > .tmp-waterfall-probe.mjs <<'NODE'
          import fs from 'node:fs';
          const pageUrl = 'https://plants.ces.ncsu.edu/plants/acer-palmatum-subsp-matsumurae/common-name/spiderleaf-maple/';
          const response = await fetch(pageUrl, {headers:{'User-Agent':'JapaneseMapleAtlas/1.0 visual-review'}});
          if (!response.ok) throw new Error('source page HTTP ' + response.status);
          const html = await response.text();
          for (const required of ["Acer palmatum var. dissectum 'Waterfall'", 'F. D. Richards', 'CC-BY-SA 2.0']) {
            if (!html.includes(required)) throw new Error('missing source evidence: ' + required);
          }
          const marker = 'Acer_palmatum_var._d_P8Hh4wJlyIyM.jpeg';
          const index = html.indexOf(marker);
          if (index < 0) throw new Error('exact source marker missing');
          const start = html.lastIndexOf('https://eit-planttoolbox-prod.s3.amazonaws.com/', index);
          const end = html.indexOf('"', index);
          if (start < 0 || end < 0) throw new Error('signed URL not recoverable');
          const url = html.slice(start, end).replace(/&amp;/g, '&');
          const imageResponse = await fetch(url, {headers:{'User-Agent':'JapaneseMapleAtlas/1.0 visual-review'}});
          if (!imageResponse.ok) throw new Error('image HTTP ' + imageResponse.status);
          const bytes = Buffer.from(await imageResponse.arrayBuffer());
          if (!bytes.subarray(0,2).equals(Buffer.from([0xff,0xd8]))) throw new Error('not JPEG');
          fs.writeFileSync('waterfall-fd-richards-source.jpg', bytes);
          fs.writeFileSync('waterfall-fd-richards-source.json', JSON.stringify({pageUrl, exactOriginalUrl:url, bytes:bytes.length}, null, 2));
          NODE
          node .tmp-waterfall-probe.mjs
          rm .tmp-waterfall-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: waterfall-fd-richards-probe
          retention-days: 2
          if-no-files-found: error
          path: |
            waterfall-fd-richards-source.jpg
            waterfall-fd-richards-source.json
