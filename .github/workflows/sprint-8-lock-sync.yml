name: Sprint 8 lockfile synchronisation

on:
  push:
    branches:
      - sprint-8-advanced-search

permissions:
  contents: write

jobs:
  synchronise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint-8-advanced-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronise package lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit package lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Package lock is already synchronised."
            exit 0
          fi
          git add package-lock.json
          git commit -m "Synchronise Sprint 8 package lock"
          git push origin HEAD:sprint-8-advanced-search
