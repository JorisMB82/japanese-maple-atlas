name: Temporary C-002 asset acquisition PR launcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  launch-acquisition:
    if: github.head_ref == 'media/visual-first-assets-c002-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-c002-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract and execute governed acquisition script
        run: |
          sed -n "/cat > \/tmp\/acquire-c002-01.mjs <<'NODE'/,/^          NODE$/p" .github/workflows/asset-acquire-c002-01.yml \
            | sed '1d;$d;s/^          //' > .tmp-acquire-c002-01.mjs
          test -s .tmp-acquire-c002-01.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.tmp-acquire-c002-01.mjs')
          text = path.read_text()
          anchor = "          const filePage = title => `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(title).replace(/%2F/g, '/')}`;\n"
          helper = anchor + """
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const fetchWithRetry = async (url, options, label) => {
            let response;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              await sleep(attempt === 0 ? 1000 : 0);
              response = await fetch(url, options);
              if (response.status !== 429 && response.status < 500) return response;
              if (attempt === 5) return response;
              const retryAfter = Number(response.headers.get('retry-after'));
              const delay = Number.isFinite(retryAfter) && retryAfter > 0
                ? retryAfter * 1000
                : 5000 * (2 ** attempt);
              console.log(`${label}: HTTP ${response.status}; retrying in ${delay} ms`);
              await sleep(delay);
            }
            return response;
          };
"""
          if anchor not in text:
              raise SystemExit('filePage anchor not found')
          text = text.replace(anchor, helper, 1)
          api_old = "          const apiResponse = await fetch(apiUrl, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 media-acquisition' } });"
          api_new = "          const apiResponse = await fetchWithRetry(apiUrl, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 media-acquisition' } }, `${spec.id} metadata`);"
          original_old = "          const response = await fetch(info.url, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 media-acquisition' } });"
          original_new = "          const response = await fetchWithRetry(info.url, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 media-acquisition' } }, `${spec.id} original`);"
          if api_old not in text or original_old not in text:
              raise SystemExit('fetch replacement anchor not found')
          text = text.replace(api_old, api_new, 1).replace(original_old, original_new, 1)
          path.write_text(text)
          PY
          node .tmp-acquire-c002-01.mjs
          rm .tmp-acquire-c002-01.mjs

      - name: Generate canonical media manifest
        run: npm run process:media

      - name: Validate complete repository package
        run: |
          set -o pipefail
          {
            npm run validate:media
            npm run process:media:check
            npm run validate:catalogue
            npm run compile:atlas:check
            npm run compile:catalogue:check
            npm run validate:schemas
            npm run validate:repository
            npm run validate:search
            npm run validate:graph
            npm run validate:explorer
            npm run test:unit
            npm run test:integration
            npm run test:coverage
            npm run build
            npm run validate:quality
            npm run release:manifest
          } 2>&1 | tee validation-c002-01.log

      - name: Upload inspection and validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: c002-lawful-assets-01
          if-no-files-found: error
          retention-days: 14
          path: |
            atlas-repository/media-sources/catalogue/CUL-000016/
            atlas-repository/media-sources/catalogue/CUL-000019/
            public/media/derivatives/catalogue/cul-000016/
            public/media/derivatives/catalogue/cul-000019/
            atlas-repository/catalogue-profiles/media/CUL-000016.media.json
            atlas-repository/catalogue-profiles/media/CUL-000019.media.json
            atlas-repository/catalogue-profiles/CUL-000016.json
            atlas-repository/catalogue-profiles/CUL-000019.json
            docs/registers/MEDIA-SOURCE-ACQUISITION_C-002-01.json
            public/media/derivatives/manifest.json
            validation-c002-01.log

      - name: Commit generated package and remove temporary launch files
        run: |
          rm .github/workflows/asset-acquire-c002-01.yml
          rm .github/workflows/asset-acquire-c002-01-pr.yml
          rm docs/.asset-acquire-trigger-c002-01
          git config user.name "Japanese Maple Atlas Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Media: add lawful galleries for Autumn Moon and Shin-deshōjō"
          git push origin HEAD:media/visual-first-assets-c002-01
