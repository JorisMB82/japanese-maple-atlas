name: Temporary Wave 3 Waterfall asset acquisition

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  acquire-waterfall:
    if: github.head_ref == 'media/visual-first-assets-wave-3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-wave-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Acquire exact Waterfall originals and build governed package
        run: |
          cat > .tmp-wave3-waterfall.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { renderRasterProfiles } from './lib/raster-media.mjs';
          import { PROFILES } from './scripts/process-media.mjs';

          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const cleanHtml = value => String(value || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#039;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
          const reviewedAt = '2026-07-30T16:45:00Z';
          const reviewedDate = '2026-07-30';
          const branch = 'media/visual-first-assets-wave-3';

          async function fetchWithRetry(url, label) {
            let response;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              if (attempt > 0) await sleep(5000 * (2 ** (attempt - 1)));
              response = await fetch(url, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 visual-first-media' } });
              if (response.status !== 429 && response.status < 500) return response;
              console.log(label + ': HTTP ' + response.status + '; retry ' + (attempt + 1) + '/6');
            }
            return response;
          }

          const candidates = [
            {
              id:'MED-CUL-000017-001', title:'Acer palmatum cv waterfall 1.jpg', role:'habit-primary', isPrimary:true,
              creator:'Mark Pellegrini', rightsHolder:'Mark Pellegrini', expectedLicence:/CC BY-SA 2\.5/i,
              altText:'Source-identified ‘Waterfall’ Japanese maple showing a cascading green spring canopy at Longwood Gardens.',
              caption:'Whole-plant spring habit of a source-identified ‘Waterfall’ Japanese maple at Longwood Gardens.',
              confidence:'source-asserted',
              basis:'The photographer identifies the plant as Acer palmatum cultivar Waterfall at Longwood Gardens.',
              limitations:'No accession or propagation record was recovered. Green dissectum habit alone cannot authenticate this cultivar.',
              qualification:'Source-identified at Longwood Gardens; not independently authenticated by the Japanese Maple Atlas. Similar green dissectum cultivars remain visually confusable.',
              location:'Longwood Gardens, Kennett Square, Pennsylvania, United States'
            },
            {
              id:'MED-CUL-000017-002', title:'Acer palmatum cv waterfall 2.jpg', role:'foliage-detail', isPrimary:false,
              creator:'Mark Pellegrini', rightsHolder:'Mark Pellegrini', expectedLicence:/CC BY-SA 2\.5/i,
              altText:'Attached green dissected foliage of a source-identified ‘Waterfall’ Japanese maple at Longwood Gardens.',
              caption:'Attached spring foliage detail from the source-identified Longwood Gardens ‘Waterfall’ plant.',
              confidence:'source-asserted',
              basis:'The photographer identifies this companion frame as Acer palmatum cultivar Waterfall at Longwood Gardens.',
              limitations:'The frame is attached-foliage context, not proof that any green dissected leaf is ‘Waterfall’.',
              qualification:'Source-identified at Longwood Gardens; not independently authenticated by the Japanese Maple Atlas. Leaf form alone does not establish cultivar identity.',
              location:'Longwood Gardens, Kennett Square, Pennsylvania, United States'
            },
            {
              id:'MED-CUL-000017-003', title:"Acer palmatum 'Waterfall' JPG1.jpg", role:'seasonal-diagnostic', isPrimary:false,
              creator:'Jean-Pol GRANDMONT', rightsHolder:'Jean-Pol GRANDMONT', expectedLicence:/CC BY(?:-SA)? 3\.0/i,
              altText:'Autumn leaves of a documented ‘Waterfall’ Japanese maple planted in 1980 at Arboretum Robert Lenoir.',
              caption:'Autumn foliage of documented ‘Waterfall’ specimen S48A–205 at Arboretum Robert Lenoir, planted in 1980.',
              confidence:'documented',
              basis:'The source records the cultivar, Arboretum Robert Lenoir specimen position S48A–205 and planting year 1980.',
              limitations:'The photograph documents one specimen and seasonal expression. Autumn colour balance varies and does not authenticate unrelated plants.',
              qualification:'Documented as specimen S48A–205 at Arboretum Robert Lenoir; the image illustrates that specimen’s autumn expression, not a universal diagnostic colour.',
              location:'Arboretum Robert Lenoir, Rendeux, Belgium'
            }
          ];

          const licenceUrl = licence => {
            if (/CC BY-SA 2\.5/i.test(licence)) return 'https://creativecommons.org/licenses/by-sa/2.5/';
            if (/CC BY-SA 3\.0/i.test(licence)) return 'https://creativecommons.org/licenses/by-sa/3.0/';
            if (/CC BY 3\.0/i.test(licence)) return 'https://creativecommons.org/licenses/by/3.0/';
            throw new Error('Unsupported selected licence: ' + licence);
          };

          const sourceDirectory = 'atlas-repository/media-sources/catalogue/CUL-000017';
          fs.mkdirSync(sourceDirectory, { recursive:true });
          fs.mkdirSync('public/media/derivatives/catalogue/cul-000017', { recursive:true });
          const assets = [];
          const items = [];

          for (const candidate of candidates) {
            const params = new URLSearchParams({
              action:'query', format:'json', formatversion:'2', prop:'imageinfo', titles:'File:' + candidate.title,
              iiprop:'url|size|mime|sha1|extmetadata'
            });
            const apiUrl = 'https://commons.wikimedia.org/w/api.php?' + params;
            const metaResponse = await fetchWithRetry(apiUrl, candidate.title + ' metadata');
            if (!metaResponse?.ok) throw new Error(candidate.title + ': metadata HTTP ' + metaResponse?.status);
            const metadata = await metaResponse.json();
            const page = metadata.query?.pages?.[0];
            const info = page?.imageinfo?.[0];
            if (page?.missing || !info?.url) throw new Error(candidate.title + ': exact original not found');
            if (info.mime !== 'image/jpeg') throw new Error(candidate.title + ': expected JPEG, got ' + info.mime);
            const observedLicence = cleanHtml(info.extmetadata?.LicenseShortName?.value);
            if (!candidate.expectedLicence.test(observedLicence)) throw new Error(candidate.title + ': incompatible observed licence ' + observedLicence);
            const selectedLicence = observedLicence.match(/CC BY-SA 2\.5/i)?.[0] || observedLicence.match(/CC BY-SA 3\.0/i)?.[0] || observedLicence.match(/CC BY 3\.0/i)?.[0];
            if (!selectedLicence) throw new Error(candidate.title + ': exact compatible licence could not be selected');

            const sourceResponse = await fetchWithRetry(info.url, candidate.title + ' original');
            if (!sourceResponse?.ok) throw new Error(candidate.title + ': original HTTP ' + sourceResponse?.status);
            const sourceBytes = Buffer.from(await sourceResponse.arrayBuffer());
            if (!sourceBytes.subarray(0,2).equals(Buffer.from([0xff,0xd8]))) throw new Error(candidate.title + ': bytes are not JPEG');
            const sourcePath = sourceDirectory + '/' + candidate.id + '-source.jpg';
            fs.writeFileSync(sourcePath, sourceBytes);

            const rendered = renderRasterProfiles(sourceBytes, PROFILES);
            const derivatives = Object.entries(rendered).map(([profile, output]) => {
              const derivativePath = '/media/derivatives/catalogue/cul-000017/' + candidate.id.toLowerCase() + '-' + profile + '.jpg';
              fs.writeFileSync(path.join('public', derivativePath.replace(/^\//, '')), output.bytes);
              return { profile, path:derivativePath, width:output.width, height:output.height, mimeType:output.mimeType, sha256:sha256(output.bytes), derivedFrom:candidate.id };
            });
            const sourcePage = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(candidate.title).replace(/%2F/g, '/');
            const attribution = 'Photograph by ' + candidate.creator + ', ' + selectedLicence + ', via Wikimedia Commons.';
            assets.push({
              id:candidate.id, cultivarId:'CUL-000017', mediaType:'photograph', role:candidate.role, isPrimary:candidate.isPrimary, status:'approved',
              assetPath:derivatives.find(item => item.profile === 'display').path,
              thumbnailPath:derivatives.find(item => item.profile === 'thumb').path,
              altText:candidate.altText, caption:candidate.caption, creator:candidate.creator, rightsHolder:candidate.rightsHolder,
              rightsBasis:'creative-commons', licence:selectedLicence, licenceUrl:licenceUrl(selectedLicence), sourceUrl:sourcePage,
              sourceItemId:'Wikimedia Commons ' + candidate.title, attributionText:attribution,
              source:{ path:'/' + sourcePath, sha256:sha256(sourceBytes), preservation:'Exact original JPEG bytes downloaded from Wikimedia Commons and retained without modification.' },
              identity:{ confidence:candidate.confidence, identificationBasis:candidate.basis, limitations:candidate.limitations, publicQualification:candidate.qualification },
              privacy:{ status:'location-generalised', exifRetained:false, gpsRetained:false, locationGranularity:candidate.location },
              derivatives,
              approvalHistory:[{ status:'approved', date:reviewedDate, authority:'Japanese Maple Atlas media / visual-assets stream', note:'Exact source rights, attribution, identity qualification, privacy treatment, role and deterministic derivatives reviewed under the Visual-First Catalogue contract.' }]
            });
            items.push({
              mediaId:candidate.id, cultivarId:'CUL-000017', fileTitle:candidate.title, sourcePage, exactOriginalUrl:info.url,
              commonsApiUrl:apiUrl, creator:candidate.creator, rightsHolder:candidate.rightsHolder, licence:selectedLicence,
              licenceUrl:licenceUrl(selectedLicence), commonsSha1:info.sha1, sourceSha256:sha256(sourceBytes),
              originalWidth:info.width, originalHeight:info.height, originalBytes:sourceBytes.length,
              description:cleanHtml(info.extmetadata?.ImageDescription?.value), dateTimeOriginal:cleanHtml(info.extmetadata?.DateTimeOriginal?.value),
              role:candidate.role, primary:candidate.isPrimary, identityConfidence:candidate.confidence,
              identityQualification:candidate.qualification,
              privacyTreatment:'Original preserved; public derivatives are pixel-decoded and re-encoded without EXIF, GPS or text metadata.', derivatives
            });
            await sleep(2500);
          }

          const sidecar = {
            schemaVersion:'1.0.0', cultivarId:'CUL-000017', publicationClass:'catalogue-profile', status:'approved', assets,
            roleException:null,
            review:{ reviewedBy:'Japanese Maple Atlas media / visual-assets stream', reviewedAt, notes:'Complete three-role Visual-First gallery using distinct Longwood Gardens spring habit and attached-foliage frames plus one documented Robert Lenoir autumn specimen. Similar green dissectum cultivars remain visually confusable.' }
          };
          fs.writeFileSync('atlas-repository/catalogue-profiles/media/CUL-000017.media.json', JSON.stringify(sidecar, null, 2) + '\n');

          const profilePath = 'atlas-repository/catalogue-profiles/CUL-000017.json';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          profile.profileVersion = '1.1.0';
          profile.media = { state:'approved-primary', primaryMediaId:'MED-CUL-000017-001', candidateMediaIds:['MED-CUL-000017-002','MED-CUL-000017-003'], governedGap:null, visualComplete:true, identityBasis:'asserted' };
          profile.review.notes += ' A lawful three-role Visual-First gallery has completed media review; the profile remains non-public and publication is not claimed.';
          profile.revisionHistory.push({ version:'1.1.0', date:reviewedAt, actor:'Japanese Maple Atlas media / visual-assets stream', change:'Added an approved lawful three-role Catalogue gallery with exact source preservation, item-level Creative Commons attribution, bounded identity qualification, privacy-treated deterministic derivatives and canonical primary linkage; publication state remains unchanged.' });
          fs.writeFileSync(profilePath, JSON.stringify(profile, null, 2) + '\n');

          fs.writeFileSync('docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-WATERFALL-01.json', JSON.stringify({
            schemaVersion:'1.0.0', repositoryBaseline:'82900b9e071d733cbdccd34771454f6154a83fc8', branch, reviewedAt,
            packageId:'WAVE-3-WATERFALL-01', status:'complete-three-role-gallery', items
          }, null, 2) + '\n');

          const registerPath = 'docs/registers/MEDIA-CANDIDATE-REGISTER_C-002.md';
          fs.appendFileSync(registerPath, [
            '', '## Wave 3 execution update — CUL-000017 Waterfall', '',
            'Three exact Wikimedia Commons originals completed the governed minimum gallery on 2026-07-30:', '',
            '- MED-CUL-000017-001 — habit-primary — Acer palmatum cv waterfall 1.jpg — Mark Pellegrini — Creative Commons.',
            '- MED-CUL-000017-002 — foliage-detail — Acer palmatum cv waterfall 2.jpg — Mark Pellegrini — Creative Commons.',
            "- MED-CUL-000017-003 — seasonal-diagnostic — Acer palmatum 'Waterfall' JPG1.jpg — Jean-Pol GRANDMONT — Creative Commons; documented Robert Lenoir specimen S48A–205, planted 1980.", '',
            'The two Longwood frames remain separate roles only after visual inspection confirms distinct whole-plant and attached-foliage compositions. Generic green dissectum resemblance remains insufficient for authentication.', ''
          ].join('\n'));

          const queuePath = 'docs/MEDIA-017_Visual-First-Permission-and-Source-Acquisition-Queue.md';
          fs.appendFileSync(queuePath, [
            '', '## Wave 3 execution update — 2026-07-30', '',
            '- CUL-000017 Waterfall: three exact open-licence originals acquired, hashed, processed and linked as a complete non-public gallery.',
            '- JCRA remains an optional accession-mapped backfill route. No request sent and no permission claimed.', ''
          ].join('\n'));

          const qualityPath = 'quality/quality-gates.json';
          const quality = JSON.parse(fs.readFileSync(qualityPath, 'utf8'));
          quality.repositoryInvariants.catalogueMediaSidecars = 5;
          quality.repositoryInvariants.catalogueMediaAssets = 15;
          fs.writeFileSync(qualityPath, JSON.stringify(quality, null, 2) + '\n');

          const mediaTestPath = 'tests/integration/media-pipeline.test.mjs';
          let mediaTest = fs.readFileSync(mediaTestPath, 'utf8');
          mediaTest = mediaTest.replace('manifest.derivativeCount,68', 'manifest.derivativeCount,80');
          mediaTest = mediaTest.replace(').size,68', ').size,80');
          mediaTest = mediaTest.replace("image/jpeg').length,48", "image/jpeg').length,60");
          mediaTest = mediaTest.replace('5 Reference Standard assets; 12 Catalogue assets; 68 derivatives;', '5 Reference Standard assets; 15 Catalogue assets; 80 derivatives;');
          fs.writeFileSync(mediaTestPath, mediaTest);

          const catalogueTestPath = 'tests/integration/catalogue-profile-pipeline.test.mjs';
          let catalogueTest = fs.readFileSync(catalogueTestPath, 'utf8');
          catalogueTest = catalogueTest.replace("['CUL-000017', 'candidate-under-review']", "['CUL-000017', 'approved-primary']");
          fs.writeFileSync(catalogueTestPath, catalogueTest);

          const sourceRows = items.map(item => '| ' + item.mediaId + ' | ' + item.role + ' | ' + item.creator + ' | ' + item.licence + ' | ' + item.sourceSha256 + ' |');
          const handoff = [
            '# HANDOFF-MEDIA-CATALOGUE-007 — Wave 3 Waterfall Gallery', '',
            '**Status:** COMPLETE ASSET PACKAGE — protected review required',
            '**Protected baseline:** 82900b9e071d733cbdccd34771454f6154a83fc8',
            '**Execution branch:** ' + branch,
            '**Execution date:** 2026-07-30', '',
            '## Completed gallery', '',
            'CUL-000017 — Acer palmatum ‘Waterfall’ has one lawful habit-primary, one distinct attached-foliage detail and one documented autumn seasonal diagnostic. The profile remains non-public and publishedAt remains null.', '',
            '## Source inventory', '',
            '| Media ID | Role | Creator | Licence | Source SHA-256 |',
            '| --- | --- | --- | --- | --- |',
            ...sourceRows, '',
            'Each exact original JPEG is preserved in the canonical source directory. Each asset has deterministic thumb, card, display and archive derivatives with declared hashes, dimensions, MIME type and lineage. Public derivatives retain no EXIF, GPS or textual metadata.', '',
            '## Controlled boundaries', '',
            '- The Longwood items remain source-asserted.',
            '- The Robert Lenoir item documents specimen S48A–205 and one autumn expression.',
            '- Generic green dissectum imagery is not used.',
            '- No role exception, publication action, new identity or Reference Standard G5 change is included.', ''
          ].join('\n');
          fs.writeFileSync('docs/HANDOFF-MEDIA-CATALOGUE-007_Wave-3-Waterfall-Gallery.md', handoff);

          console.log(JSON.stringify({ assets:assets.length, derivatives:assets.flatMap(item => item.derivatives).length, sourceHashes:items.map(item => [item.mediaId,item.sourceSha256]) }, null, 2));
          NODE
          node .tmp-wave3-waterfall.mjs
          rm .tmp-wave3-waterfall.mjs

      - name: Generate canonical media manifest
        run: npm run process:media

      - name: Validate complete repository package
        run: |
          set -o pipefail
          {
            npm run validate:media
            npm run process:media:check
            npm run validate:contributions
            npm run validate:reference-standards
            npm run validate:catalogue
            npm run compile:atlas:check
            npm run compile:catalogue:check
            npm run validate:schemas
            npm run validate:repository
            npm run validate:search
            npm run validate:graph
            npm run validate:explorer
            npm run test:unit
            npm run test:integration
            npm run test:coverage
            npm run build
            npm run test:regression
            npm run validate:quality
            npm run release:manifest
          } 2>&1 | tee validation-wave3-waterfall.log

      - name: Upload inspection and validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave3-waterfall-gallery
          if-no-files-found: error
          retention-days: 14
          path: |
            atlas-repository/media-sources/catalogue/CUL-000017/
            public/media/derivatives/catalogue/cul-000017/
            atlas-repository/catalogue-profiles/media/CUL-000017.media.json
            atlas-repository/catalogue-profiles/CUL-000017.json
            docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-WATERFALL-01.json
            docs/HANDOFF-MEDIA-CATALOGUE-007_Wave-3-Waterfall-Gallery.md
            validation-wave3-waterfall.log

      - name: Commit governed Waterfall package and remove temporary workflow
        run: |
          rm .github/workflows/asset-wave3-waterfall.yml
          git config user.name "Japanese Maple Atlas Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Media: add lawful Waterfall gallery"
          git push origin HEAD:media/visual-first-assets-wave-3
