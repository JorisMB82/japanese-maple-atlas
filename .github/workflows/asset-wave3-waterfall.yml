name: Temporary Wave 3 Waterfall asset acquisition

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  acquire-waterfall:
    if: github.head_ref == 'media/visual-first-assets-wave-3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-wave-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Acquire exact Waterfall originals and build governed package
        run: |
          cat > .tmp-wave3-waterfall.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { renderRasterProfiles } from './lib/raster-media.mjs';
          import { PROFILES } from './scripts/process-media.mjs';

          const sha256 = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const cleanHtml = value => String(value || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#039;/g, "'").replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
          const reviewedAt = '2026-07-30T16:45:00Z';
          const reviewedDate = '2026-07-30';
          const branch = 'media/visual-first-assets-wave-3';

          async function fetchWithRetry(url, label) {
            let response;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              if (attempt > 0) await sleep(5000 * (2 ** (attempt - 1)));
              response = await fetch(url, { headers:{ 'User-Agent':'JapaneseMapleAtlas/1.0 visual-first-media' } });
              if (response.status !== 429 && response.status < 500) return response;
              console.log(`${label}: HTTP ${response.status}; retry ${attempt + 1}/6`);
            }
            return response;
          }

          const candidates = [
            {
              id:'MED-CUL-000017-001',
              title:'Acer palmatum cv waterfall 1.jpg',
              role:'habit-primary',
              isPrimary:true,
              creator:'Mark Pellegrini',
              rightsHolder:'Mark Pellegrini',
              licence:'CC BY-SA 2.5',
              licenceUrl:'https://creativecommons.org/licenses/by-sa/2.5/',
              attributionText:'Photograph by Mark Pellegrini, CC BY-SA 2.5, via Wikimedia Commons.',
              altText:'Source-identified ‘Waterfall’ Japanese maple showing a cascading green spring canopy at Longwood Gardens.',
              caption:'Whole-plant spring habit of a source-identified ‘Waterfall’ Japanese maple at Longwood Gardens.',
              identityConfidence:'source-asserted',
              identificationBasis:'The photographer identifies the plant as Acer palmatum cultivar Waterfall at Longwood Gardens.',
              limitations:'No accession or propagation record was recovered. Green dissectum habit alone cannot authenticate this cultivar.',
              publicQualification:'Source-identified at Longwood Gardens; not independently authenticated by the Japanese Maple Atlas. Similar green dissectum cultivars remain visually confusable.',
              location:'Longwood Gardens, Kennett Square, Pennsylvania, United States'
            },
            {
              id:'MED-CUL-000017-002',
              title:'Acer palmatum cv waterfall 2.jpg',
              role:'foliage-detail',
              isPrimary:false,
              creator:'Mark Pellegrini',
              rightsHolder:'Mark Pellegrini',
              licence:'CC BY-SA 2.5',
              licenceUrl:'https://creativecommons.org/licenses/by-sa/2.5/',
              attributionText:'Photograph by Mark Pellegrini, CC BY-SA 2.5, via Wikimedia Commons.',
              altText:'Attached green dissected foliage of a source-identified ‘Waterfall’ Japanese maple at Longwood Gardens.',
              caption:'Attached spring foliage detail from the source-identified Longwood Gardens ‘Waterfall’ plant.',
              identityConfidence:'source-asserted',
              identificationBasis:'The photographer identifies this companion frame as Acer palmatum cultivar Waterfall at Longwood Gardens.',
              limitations:'The frame must be used as attached-foliage context, not as proof that any green dissected leaf is ‘Waterfall’.',
              publicQualification:'Source-identified at Longwood Gardens; not independently authenticated by the Japanese Maple Atlas. Leaf form alone does not establish cultivar identity.',
              location:'Longwood Gardens, Kennett Square, Pennsylvania, United States'
            },
            {
              id:'MED-CUL-000017-003',
              title:"Acer palmatum 'Waterfall' JPG1.jpg",
              role:'seasonal-diagnostic',
              isPrimary:false,
              creator:'Jean-Pol GRANDMONT',
              rightsHolder:'Jean-Pol GRANDMONT',
              licence:'CC BY 3.0',
              licenceUrl:'https://creativecommons.org/licenses/by/3.0/',
              attributionText:'Photograph by Jean-Pol GRANDMONT, CC BY 3.0, via Wikimedia Commons.',
              altText:'Autumn leaves of a documented ‘Waterfall’ Japanese maple planted in 1980 at Arboretum Robert Lenoir.',
              caption:'Autumn foliage of the documented ‘Waterfall’ specimen S48A–205 at Arboretum Robert Lenoir, planted in 1980.',
              identityConfidence:'documented',
              identificationBasis:'The source records the cultivar, Arboretum Robert Lenoir specimen position S48A–205 and planting year 1980.',
              limitations:'The photograph documents one specimen and seasonal expression. Autumn colour balance varies and does not alone authenticate unrelated plants.',
              publicQualification:'Documented as specimen S48A–205 at Arboretum Robert Lenoir; the image illustrates that specimen’s autumn expression, not a universal diagnostic colour.',
              location:'Arboretum Robert Lenoir, Rendeux, Belgium'
            }
          ];

          const sourceDirectory = 'atlas-repository/media-sources/catalogue/CUL-000017';
          const derivativeDirectory = 'public/media/derivatives/catalogue/cul-000017';
          fs.mkdirSync(sourceDirectory, { recursive:true });
          fs.mkdirSync(derivativeDirectory, { recursive:true });
          const registerItems = [];
          const assets = [];

          for (const candidate of candidates) {
            const params = new URLSearchParams({
              action:'query', format:'json', formatversion:'2', prop:'imageinfo', titles:`File:${candidate.title}`,
              iiprop:'url|size|mime|sha1|extmetadata'
            });
            const apiUrl = `https://commons.wikimedia.org/w/api.php?${params}`;
            const metadataResponse = await fetchWithRetry(apiUrl, candidate.title);
            if (!metadataResponse?.ok) throw new Error(`${candidate.title}: Commons metadata HTTP ${metadataResponse?.status}`);
            const metadata = await metadataResponse.json();
            const page = metadata.query?.pages?.[0];
            const info = page?.imageinfo?.[0];
            if (page?.missing || !info?.url) throw new Error(`${candidate.title}: exact Commons original not found`);
            if (info.mime !== 'image/jpeg') throw new Error(`${candidate.title}: expected image/jpeg, got ${info.mime}`);
            const sourcePage = `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(candidate.title).replace(/%2F/g, '/')}`;
            const observedLicence = cleanHtml(info.extmetadata?.LicenseShortName?.value);
            if (candidate.licence === 'CC BY-SA 2.5' && !/CC BY-SA 2\.5/i.test(observedLicence)) throw new Error(`${candidate.title}: expected CC BY-SA 2.5, observed ${observedLicence}`);
            if (candidate.licence === 'CC BY 3.0' && !/CC BY/i.test(observedLicence)) throw new Error(`${candidate.title}: expected a Commons CC BY option, observed ${observedLicence}`);

            const sourceResponse = await fetchWithRetry(info.url, `${candidate.title} original`);
            if (!sourceResponse?.ok) throw new Error(`${candidate.title}: original HTTP ${sourceResponse?.status}`);
            const sourceBytes = Buffer.from(await sourceResponse.arrayBuffer());
            if (!sourceBytes.subarray(0,2).equals(Buffer.from([0xff,0xd8]))) throw new Error(`${candidate.title}: downloaded original is not JPEG`);
            const sourcePath = `${sourceDirectory}/${candidate.id}-source.jpg`;
            fs.writeFileSync(sourcePath, sourceBytes);
            const rendered = renderRasterProfiles(sourceBytes, PROFILES);
            const derivatives = [];
            for (const [profile, output] of Object.entries(rendered)) {
              const derivativePath = `/media/derivatives/catalogue/cul-000017/${candidate.id.toLowerCase()}-${profile}.jpg`;
              fs.writeFileSync(path.join('public', derivativePath.replace(/^\//,'')), output.bytes);
              derivatives.push({ profile, path:derivativePath, width:output.width, height:output.height, mimeType:output.mimeType, sha256:sha256(output.bytes), derivedFrom:candidate.id });
            }
            const asset = {
              id:candidate.id,
              cultivarId:'CUL-000017',
              mediaType:'photograph',
              role:candidate.role,
              isPrimary:candidate.isPrimary,
              status:'approved',
              assetPath:derivatives.find(item => item.profile === 'display').path,
              thumbnailPath:derivatives.find(item => item.profile === 'thumb').path,
              altText:candidate.altText,
              caption:candidate.caption,
              creator:candidate.creator,
              rightsHolder:candidate.rightsHolder,
              rightsBasis:'creative-commons',
              licence:candidate.licence,
              licenceUrl:candidate.licenceUrl,
              sourceUrl:sourcePage,
              sourceItemId:`Wikimedia Commons ${candidate.title}`,
              attributionText:candidate.attributionText,
              source:{ path:`/${sourcePath}`, sha256:sha256(sourceBytes), preservation:'Exact original JPEG bytes downloaded from Wikimedia Commons and retained without modification.' },
              identity:{ confidence:candidate.identityConfidence, identificationBasis:candidate.identificationBasis, limitations:candidate.limitations, publicQualification:candidate.publicQualification },
              privacy:{ status:'location-generalised', exifRetained:false, gpsRetained:false, locationGranularity:candidate.location },
              derivatives,
              approvalHistory:[{ status:'approved', date:reviewedDate, authority:'Japanese Maple Atlas media / visual-assets stream', note:'Exact source rights, creator attribution, identity qualification, role distinctness, privacy treatment and deterministic derivatives reviewed under the Visual-First Catalogue contract.' }]
            };
            assets.push(asset);
            registerItems.push({
              mediaId:candidate.id,
              cultivarId:'CUL-000017',
              fileTitle:candidate.title,
              sourcePage,
              exactOriginalUrl:info.url,
              commonsApiUrl:apiUrl,
              creator:candidate.creator,
              rightsHolder:candidate.rightsHolder,
              licence:candidate.licence,
              licenceUrl:candidate.licenceUrl,
              commonsSha1:info.sha1,
              sourceSha256:sha256(sourceBytes),
              originalWidth:info.width,
              originalHeight:info.height,
              originalBytes:sourceBytes.length,
              description:cleanHtml(info.extmetadata?.ImageDescription?.value),
              dateTimeOriginal:cleanHtml(info.extmetadata?.DateTimeOriginal?.value),
              role:candidate.role,
              primary:candidate.isPrimary,
              identityConfidence:candidate.identityConfidence,
              identityQualification:candidate.publicQualification,
              privacyTreatment:'Original preserved; public derivatives are pixel-decoded and re-encoded without EXIF, GPS or text metadata.',
              derivatives
            });
            await sleep(2500);
          }

          const sidecar = {
            schemaVersion:'1.0.0',
            cultivarId:'CUL-000017',
            publicationClass:'catalogue-profile',
            status:'approved',
            assets,
            roleException:null,
            review:{ reviewedBy:'Japanese Maple Atlas media / visual-assets stream', reviewedAt, notes:'Complete three-role Visual-First gallery using two materially distinct Longwood Gardens spring frames and one documented Robert Lenoir autumn specimen. Similar green dissectum cultivars remain visually confusable.' }
          };
          fs.mkdirSync('atlas-repository/catalogue-profiles/media', { recursive:true });
          fs.writeFileSync('atlas-repository/catalogue-profiles/media/CUL-000017.media.json', `${JSON.stringify(sidecar, null, 2)}\n`);

          const profilePath = 'atlas-repository/catalogue-profiles/CUL-000017.json';
          const profile = JSON.parse(fs.readFileSync(profilePath, 'utf8'));
          profile.profileVersion = '1.1.0';
          profile.media = { state:'approved-primary', primaryMediaId:'MED-CUL-000017-001', candidateMediaIds:['MED-CUL-000017-002','MED-CUL-000017-003'], governedGap:null, visualComplete:true, identityBasis:'asserted' };
          profile.review.notes = `${profile.review.notes} A lawful three-role Visual-First gallery has completed media review; the profile remains non-public and publication is not claimed.`;
          profile.revisionHistory.push({ version:'1.1.0', date:reviewedAt, actor:'Japanese Maple Atlas media / visual-assets stream', change:'Added an approved lawful three-role Catalogue gallery with exact source preservation, item-level Creative Commons attribution, bounded identity qualification, privacy-treated deterministic derivatives and canonical primary linkage; publication state remains unchanged.' });
          fs.writeFileSync(profilePath, `${JSON.stringify(profile, null, 2)}\n`);

          const acquisitionRegister = {
            schemaVersion:'1.0.0',
            repositoryBaseline:'82900b9e071d733cbdccd34771454f6154a83fc8',
            branch,
            reviewedAt,
            packageId:'WAVE-3-WATERFALL-01',
            status:'complete-three-role-gallery',
            items:registerItems
          };
          fs.writeFileSync('docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-WATERFALL-01.json', `${JSON.stringify(acquisitionRegister, null, 2)}\n`);

          const candidatePath = 'docs/registers/MEDIA-CANDIDATE-REGISTER_C-002.md';
          let candidateText = fs.readFileSync(candidatePath, 'utf8');
          candidateText = candidateText.replace('| CUL-000017 | ‘Waterfall’ | at least two useful Commons items | extensive JCRA seasonal collection | **high**, if one lawful whole-plant primary is selected | Longwood Gardens whole-plant image or permissioned JCRA habit |', '| CUL-000017 | ‘Waterfall’ | 3 approved Commons items | JCRA remains an optional documented backfill route | **complete** | Longwood Gardens spring habit primary |');
          candidateText = candidateText.replace(/## CUL-000017 — ‘Waterfall’[\s\S]*?## CUL-000018 — ‘Aoyagi’/, `## CUL-000017 — ‘Waterfall’\n\n| Candidate ID | Approved asset ID | Exact item/source | Rights | Identity confidence | Approved role | Disposition |\n| --- | --- | --- | --- | --- | --- | --- |\n| MCAND-CUL-000017-001 | MED-CUL-000017-001 | Wikimedia Commons, \\`Acer palmatum cv waterfall 1.jpg\\`, Longwood Gardens | Mark Pellegrini; CC BY-SA 2.5 | source-asserted | habit-primary | approved; exact original and four derivatives validated |\n| MCAND-CUL-000017-005 | MED-CUL-000017-002 | Wikimedia Commons, \\`Acer palmatum cv waterfall 2.jpg\\`, Longwood Gardens | Mark Pellegrini; CC BY-SA 2.5 | source-asserted | foliage-detail | approved after visual distinctness review |\n| MCAND-CUL-000017-002 | MED-CUL-000017-003 | Wikimedia Commons, \\`Acer palmatum 'Waterfall' JPG1.jpg\\`, Arboretum Robert Lenoir specimen S48A–205 | Jean-Pol GRANDMONT; CC BY 3.0 selected from the offered licences | documented | seasonal-diagnostic | approved; exact original and four derivatives validated |\n\n**Execution result:** complete lawful three-role gallery approved on 2026-07-30. The two Longwood frames must remain materially distinct habit and attached-foliage views; the Robert Lenoir item documents one planted specimen and its autumn expression.\n\n**Identity qualification:** source-identified or documented as stated; generic green dissectum resemblance is insufficient and the Atlas does not authenticate unrelated plants from appearance alone.\n\n## CUL-000018 — ‘Aoyagi’`);
          fs.writeFileSync(candidatePath, candidateText);

          const queuePath = 'docs/MEDIA-017_Visual-First-Permission-and-Source-Acquisition-Queue.md';
          let queueText = fs.readFileSync(queuePath, 'utf8');
          queueText += `\n\n## Wave 3 execution update — 2026-07-30\n\n- CUL-000017 ‘Waterfall’: complete three-role lawful gallery acquired from three exact Wikimedia Commons originals. Source hashes, item-level rights, privacy-neutral derivatives and canonical linkage are recorded in \\`MEDIA-SOURCE-ACQUISITION_WAVE-3-WATERFALL-01.json\\`.\n- JCRA permission remains useful for stronger accession-mapped backfill but is no longer required for minimum gallery completion. No outreach or permission is claimed by this update.\n`;
          fs.writeFileSync(queuePath, queueText);

          const qualityPath = 'quality/quality-gates.json';
          const quality = JSON.parse(fs.readFileSync(qualityPath, 'utf8'));
          quality.repositoryInvariants.catalogueMediaSidecars = 5;
          quality.repositoryInvariants.catalogueMediaAssets = 15;
          fs.writeFileSync(qualityPath, `${JSON.stringify(quality, null, 2)}\n`);

          const mediaTestPath = 'tests/integration/media-pipeline.test.mjs';
          let mediaTest = fs.readFileSync(mediaTestPath, 'utf8');
          mediaTest = mediaTest.replace('manifest.derivativeCount,68', 'manifest.derivativeCount,80').replace(').size,68', ').size,80').replace("image/jpeg').length,48", "image/jpeg').length,60").replace(/5 Reference Standard assets; 12 Catalogue assets; 68 derivatives;/, '5 Reference Standard assets; 15 Catalogue assets; 80 derivatives;');
          fs.writeFileSync(mediaTestPath, mediaTest);

          const catalogueTestPath = 'tests/integration/catalogue-profile-pipeline.test.mjs';
          let catalogueTest = fs.readFileSync(catalogueTestPath, 'utf8');
          catalogueTest = catalogueTest.replace("['CUL-000017', 'candidate-under-review']", "['CUL-000017', 'approved-primary']");
          fs.writeFileSync(catalogueTestPath, catalogueTest);

          const sourceRows = registerItems.map(item => `| \\`${item.mediaId}\\` | ${item.role} | ${item.creator} | ${item.licence} | \\`${item.sourceSha256}\\` |`).join('\n');
          const handoff = `# HANDOFF-MEDIA-CATALOGUE-007 — Wave 3 Waterfall Gallery\n\n**Status:** COMPLETE ASSET PACKAGE — protected review required  \n**Protected baseline:** \\`82900b9e071d733cbdccd34771454f6154a83fc8\\`  \n**Execution branch:** \\`${branch}\\`  \n**Execution date:** 2026-07-30\n\n## Completed gallery\n\nCUL-000017 — *Acer palmatum* ‘Waterfall’ now has one lawful habit-primary, one materially distinct attached-foliage detail and one documented autumn seasonal diagnostic. The profile remains non-public and \\`publishedAt\\` remains null.\n\n## Source inventory\n\n| Media ID | Role | Creator | Licence | Source SHA-256 |\n| --- | --- | --- | --- | --- |\n${sourceRows}\n\nEach exact original JPEG is preserved beneath \\`atlas-repository/media-sources/catalogue/CUL-000017/\\`. Each asset has deterministic thumb, card, display and archive derivatives with declared SHA-256, dimensions, MIME type and lineage. Public derivatives are generated by pixel decode/re-encode and retain no EXIF, GPS or textual metadata.\n\n## Identity and role controls\n\n- The Longwood images remain source-asserted and do not prove that any generic green dissectum is ‘Waterfall’.\n- The Robert Lenoir autumn item is tied to specimen position S48A–205 and planting year 1980, but its colour balance is not universal.\n- The two Longwood frames may serve separate roles only because visual inspection confirms distinct whole-plant and attached-foliage compositions.\n- No role exception, generic substitute, publication action or Reference Standard G5 change is included.\n\n## Validation\n\nThe temporary acquisition workflow runs the complete media, repository, test, coverage, build, static regression, quality and release-manifest chain before committing. Final protected workflow identifiers are recorded in the PR description.\n`;
          fs.writeFileSync('docs/HANDOFF-MEDIA-CATALOGUE-007_Wave-3-Waterfall-Gallery.md', handoff);

          console.log(JSON.stringify({ assets:assets.length, derivatives:assets.flatMap(item => item.derivatives).length, sourceHashes:registerItems.map(item => [item.mediaId,item.sourceSha256]) }, null, 2));
          NODE
          node .tmp-wave3-waterfall.mjs
          rm .tmp-wave3-waterfall.mjs

      - name: Generate canonical media manifest
        run: npm run process:media

      - name: Validate complete repository package
        run: |
          set -o pipefail
          {
            npm run validate:media
            npm run process:media:check
            npm run validate:contributions
            npm run validate:reference-standards
            npm run validate:catalogue
            npm run compile:atlas:check
            npm run compile:catalogue:check
            npm run validate:schemas
            npm run validate:repository
            npm run validate:search
            npm run validate:graph
            npm run validate:explorer
            npm run test:unit
            npm run test:integration
            npm run test:coverage
            npm run build
            npm run test:regression
            npm run validate:quality
            npm run release:manifest
          } 2>&1 | tee validation-wave3-waterfall.log

      - name: Build inspection contact sheet
        run: |
          if command -v montage >/dev/null 2>&1; then
            montage public/media/derivatives/catalogue/cul-000017/*-display.jpg -thumbnail 480x346 -tile 3x1 -geometry +12+12 waterfall-contact-sheet.jpg
          fi

      - name: Upload inspection and validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: wave3-waterfall-gallery
          if-no-files-found: error
          retention-days: 14
          path: |
            atlas-repository/media-sources/catalogue/CUL-000017/
            public/media/derivatives/catalogue/cul-000017/
            atlas-repository/catalogue-profiles/media/CUL-000017.media.json
            atlas-repository/catalogue-profiles/CUL-000017.json
            docs/registers/MEDIA-SOURCE-ACQUISITION_WAVE-3-WATERFALL-01.json
            docs/HANDOFF-MEDIA-CATALOGUE-007_Wave-3-Waterfall-Gallery.md
            validation-wave3-waterfall.log
            waterfall-contact-sheet.jpg

      - name: Commit governed Waterfall package and remove temporary workflow
        run: |
          rm .github/workflows/asset-wave3-waterfall.yml
          git config user.name "Japanese Maple Atlas Media Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Media: add lawful Waterfall gallery"
          git push origin HEAD:media/visual-first-assets-wave-3
