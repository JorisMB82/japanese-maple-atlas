name: Remediation source package

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        run: |
          mkdir -p source-package
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude 'out' --exclude '.next' ./ source-package/
      - uses: actions/upload-artifact@v4
        with:
          name: sprint-10-remediation-source
          path: source-package/
          if-no-files-found: error
          retention-days: 1
