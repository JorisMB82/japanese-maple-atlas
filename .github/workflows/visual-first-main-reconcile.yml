name: Visual-First asset branch reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/visual-first-main-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media/visual-first-assets-c001-c002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Merge current main without rewriting asset history
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/visual-first-main-reconcile.yml
      - run: npm ci --no-audit --no-fund
      - name: Regenerate shared outputs and run full validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/compile-catalogue-profiles.mjs
          npm run compile:atlas
          npm run process:media
          npm run validate:media
          npm run process:media:check
          npm run validate:contributions
          npm run validate:reference-standards
          npm run validate:catalogue
          npm run compile:atlas:check
          npm run compile:catalogue:check
          npm run validate:scale
          npm run validate:schemas
          npm run validate:repository
          npm run validate:search
          npm run validate:graph
          npm run validate:explorer
          npm run test:unit
          npm run test:integration
          npm run test:coverage
          npm run build
          npm run test:regression
          npm run validate:scale
          npm run validate:quality
          npm run release:manifest
      - name: Commit reconciled validated package
        shell: bash
        run: |
          git add -A
          git add -f public/media/derivatives
          git commit -m "Media: reconcile Visual-First asset package with current main"
          git push origin HEAD:media/visual-first-assets-c001-c002
